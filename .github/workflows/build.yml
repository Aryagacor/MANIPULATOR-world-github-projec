
name: Build MANIPULATOR WORLD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Latest Source
        run: |
          mkdir -p /tmp/manipulator-source
          unzip -o MANIPULATOR-WORLD-LEVEL-UNLOCK-SOURCE.zip -d /tmp/manipulator-source

      - name: Detect Project Folder
        run: |
          PROJECT_DIR=$(find /tmp/manipulator-source -name package.json -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json tidak ditemukan"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project: $PROJECT_DIR"

      - name: Fix Admin Authentication
        run: |
          python3 - <<'PY'
          import os

          path = os.path.join(
              os.environ["PROJECT_DIR"],
              "www/index.html"
          )

          with open(path, "r", encoding="utf-8") as f:
              html = f.read()

          old_admin = "function ensureAdminAccount(){let a=accounts();a.admin={...ADMIN_SEED};saveAccounts(a)}"

          new_admin = """async function ensureAdminAccount(){
            let a=accounts();
            a.admin={
              ...ADMIN_SEED,
              username:'ADMIN',
              role:'admin',
              hash:await hash('ayam9933',ADMIN_SEED.salt)
            };
            saveAccounts(a);
          }"""

          if old_admin not in html:
              raise SystemExit("ERROR: Fungsi ADMIN lama tidak ditemukan")

          html = html.replace(old_admin, new_admin, 1)

          old_init = "(async()=>{ensureAdminAccount();let u="
          new_init = "(async()=>{await ensureAdminAccount();let u="

          if old_init not in html:
              raise SystemExit("ERROR: Inisialisasi aplikasi tidak ditemukan")

          html = html.replace(old_init, new_init, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(html)

          print("ADMIN authentication berhasil diperbarui")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Setup Capacitor Android
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANIPULATOR-WORLD-ADMIN-FIXED
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
