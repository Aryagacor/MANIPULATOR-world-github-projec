
name: Build MANIPULATOR WORLD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o MANIPULATOR-WORLD-REPAIRED-SOURCE.zip
          ls -la
          ls -la MANIPULATOR_WORLD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        working-directory: MANIPULATOR_WORLD
        run: npm install

      - name: Setup Android
        working-directory: MANIPULATOR_WORLD
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        working-directory: MANIPULATOR_WORLD
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANIPULATOR-WORLD-APK
          path: MANIPULATOR_WORLD/android/app/build/outputs/apk/debug/app-debug.apk
          
