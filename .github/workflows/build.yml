
name: Build MANIPULATOR WORLD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract Project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          mkdir extracted

          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP not found!"
            exit 1
          fi

          unzip -o "$ZIP" -d extracted

      - name: Locate Capacitor Project
        id: project
        run: |
          CONFIG=$(find extracted -name capacitor.config.json | head -n 1)

          if [ -z "$CONFIG" ]; then
            echo "Capacitor config not found!"
            exit 1
          fi

          DIR=$(dirname "$CONFIG")

          if [ ! -f "$DIR/package.json" ]; then
            echo "package.json not found!"
            exit 1
          fi

          if [ ! -f "$DIR/www/index.html" ]; then
            echo "www/index.html not found!"
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Install Capacitor Dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          npm install --no-audit --no-fund

          npm install --no-save \
            @capacitor/core@latest \
            @capacitor/cli@latest \
            @capacitor/android@latest

      - name: Generate Android Project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          npx cap add android

      - name: Sync Android Project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANIPULATOR-WORLD-APK
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
