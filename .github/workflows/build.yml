
name: Build MANIPULATOR WORLD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Find Android Project
        id: project
        run: |
          echo "Searching Android project..."
          find . -name gradlew -type f
          find . -name build.gradle -o -name build.gradle.kts

          PROJECT=$(find . -name gradlew -type f | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Gradle wrapper found."
            echo "Repository contents:"
            find . -maxdepth 5 -type f
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANIPULATOR-WORLD-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
