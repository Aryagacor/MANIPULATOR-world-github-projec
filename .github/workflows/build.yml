
name: Build MANIPULATOR WORLD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Latest Source
        run: |
          mkdir -p /tmp/manipulator-source
          unzip -o MANIPULATOR-WORLD-LEVEL-UNLOCK-SOURCE.zip -d /tmp/manipulator-source

          echo "=== SOURCE FILES ==="
          find /tmp/manipulator-source -name package.json

      - name: Detect Project Folder
        run: |
          PROJECT_DIR=$(find /tmp/manipulator-source -name package.json -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json tidak ditemukan!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project ditemukan: $PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Setup Capacitor Android
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANIPULATOR-WORLD-LEVEL-UNLOCK-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
