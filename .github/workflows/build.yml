name: Build MANIPULATOR WORLD

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip MANIPULATOR-WORLD-GITHUB-PROJECT.zip
          cd MANIPULATOR_WORLD
          npm install

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd MANIPULATOR_WORLD
          npx cap add android
          npx cap sync android
          cd android
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MANIPULATOR-WORLD-APK
          path: MANIPULATOR_WORLD/android/app/build/outputs/apk/debug/app-debug.apk
