
name: Build MANIPULATOR WORLD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          mkdir -p extracted

          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found!"
            exit 1
          fi

          echo "Extracting: $ZIP"
          unzip -o "$ZIP" -d extracted

      - name: Find Android Project
        id: project
        run: |
          PROJECT=$(find extracted -type f -name gradlew | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: gradlew not found inside ZIP!"
            echo "ZIP contents:"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANIPULATOR-WORLD-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
